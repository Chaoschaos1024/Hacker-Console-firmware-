; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
build_type = debug
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
upload_protocol = picoprobe
debug_tool = picoprobe

board_build.arduino.earlephilhower.usb_manufacturer = Chaoschaos1024
board_build.arduino.earlephilhower.usb_product = Hacker Console
board_build.arduino.earlephilhower.usb_vid = 0xBEEF
board_build.arduino.earlephilhower.usb_pid = 0xCAFE

lib_deps = 
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit SSD1306@^2.5.16
	adafruit/Adafruit NeoPixel@^1.15.5
